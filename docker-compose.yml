services:

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./www/public:/var/www/public
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - php
      - node

  php:
    build: ./docker/php
    container_name: php
    working_dir: /var/www
    volumes:
      - ./www:/var/www
      - ./config/php/php.ini:/usr/local/etc/php/php.ini
    environment:
      - TZ=Europe/Stockholm

  mariadb:
    image: mariadb:latest
    container_name: mariadb
    restart: always
    ports:
      - 3306:3306
    volumes:
      - ./db:/var/lib/mysql
      - ./config/mysql/my.cnf:/etc/mysql/my.cnf
    environment:
      - MYSQL_ROOT_PASSWORD=12345
      - MYSQL_DATABASE=db
      - MYSQL_USER=pma
      - MYSQL_PASSWORD=12345
      - TZ=Europe/Stockholm

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: pma
    restart: always
    environment:
      - PMA_HOST=mariadb
      - TZ=Europe/Stockholm
      #PMA_ABSOLUTE_URI: http://localhost/pma/
    ports:
      - "8080:80"
    depends_on:
      - mariadb

  node:
    image: node:18
    container_name: node
    restart: always
    working_dir: /sveltekit
    command: "npm run dev -- --host 0.0.0.0 --port 3000"
    volumes:
      - ./sveltekit:/sveltekit
    environment:
      - TZ=Europe/Stockholm
    ports:
      - "3000:3000"
